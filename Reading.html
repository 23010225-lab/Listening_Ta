      darkMode: 'class',

  <style>
    :root {
      --ease-silky: cubic-bezier(0.22, 1, 0.36, 1);
      --badge-clearance: 54px;
    }
    html.no-badge-clearance {
      --badge-clearance: 0px;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    .app-shell {
      height: 100dvh;
      max-width: 430px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .safe-top {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: calc(var(--badge-clearance) + max(10px, env(safe-area-inset-bottom, 0px)));
    }
    .safe-bottom-sheet {
      padding-bottom: calc(var(--badge-clearance) + max(24px, env(safe-area-inset-bottom, 0px)));
    }
    .toast-float {
      bottom: calc(82px + var(--badge-clearance) + env(safe-area-inset-bottom, 0px));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pink-gradient {
      background: linear-gradient(135deg, #F472B6, #EC4899);
    }
    .pink-gradient-soft {
      background: linear-gradient(135deg, #FFF0F6, #FCE7F3);
    }
    .dark .pink-gradient-soft {
      background: linear-gradient(135deg, #331929, #261620);
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-22px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes popCorrect {
      0% { transform: scale(1); }
      40% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-view {
      animation: fadeSlideUp 0.28s var(--ease-silky) both;
    }
    .anim-next {
      animation: slideInRight 0.24s var(--ease-silky) both;
    }
    .anim-prev {
      animation: slideInLeft 0.24s var(--ease-silky) both;
    }
    .anim-correct {
      animation: popCorrect 0.3s var(--ease-silky);
    }
    .anim-wrong {
      animation: shakeWrong 0.34s ease-in-out;
    }
    .drawer-sheet {
      transform: translateY(105%);
      transition: transform 0.34s var(--ease-silky);
    }
    .drawer-sheet.open {
      transform: translateY(0%);
    }
    .drawer-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.26s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .acc-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.32s var(--ease-silky);
    }
    .acc-body.open {
      grid-template-rows: 1fr;
    }
    .acc-inner {
      overflow: hidden;
    }
    .pink-switch {
      position: relative;
      width: 46px;
      height: 26px;
      border-radius: 999px;
      transition: background-color 0.25s var(--ease-silky);
      cursor: pointer;
      flex-shrink: 0;
    }
    .pink-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 5px rgba(59, 22, 43, 0.2);
      transition: transform 0.25s var(--ease-silky);
    }
    .pink-switch.active {
      background: linear-gradient(135deg, #F472B6, #EC4899);
    }
    .pink-switch.active::after {
      transform: translateX(20px);
    }
    .fs-sm .q-prompt { font-size: 14px; line-height: 1.55; }
    .fs-sm .q-opt { font-size: 13.5px; }
    .fs-md .q-prompt { font-size: 15.5px; line-height: 1.6; }
    .fs-md .q-opt { font-size: 14.5px; }
    .fs-lg .q-prompt { font-size: 17.5px; line-height: 1.6; }
    .fs-lg .q-opt { font-size: 16px; }
  </style>
</head>

<script>
// ============================================================================
// 1. COMPLETE B1 READING DATASET (305 QUESTIONS EXACTLY FROM CURRICULUM PDF)
// ============================================================================
const PASSAGES = {
  // PART 2 PASSAGES
  p2_1: {
    title: "Part 2 • Đề 1: Beaches (A–E)",
    text: `<p><b>A. Silver Sands:</b> This beach has a sea temperature slightly higher than other coastal areas, and with its gentle waves it's perfect for children. There's plenty to do, too, with play leaders offering games to entertain younger ones, and surfing and sailing available at all levels, including beginners. The snack bar is excellent, too.</p>
    <p><b>B. Minton Strand:</b> The sea here offers safe swimming and sailing, even for beginners, but there's still plenty to do when you want a change from sunbathing. A teenagers' beach club offers sports like cycle rides, volleyball and beach chess — great for everyone getting to know each other!</p>
    <p><b>C. Holly Bay:</b> The café here serves delicious meals and sandwiches! The water's calm in the bay, perfect for people wanting to swim across it — around 2 km! However, it's very deep, so is only suitable for strong swimmers. There are often sand artists here, and horses for hire to take you along the beach.</p>
    <p><b>D. South Beach:</b> This beautiful beach offers safe swimming. And when you fancy a change from sunbathing or watersports, there's a funfair nearby, and beautiful gardens to walk through, with tables and chairs where you can eat your own food. Leave your car by the gardens, and you'll be on the beach almost immediately.</p>
    <p><b>E. Bar Mouth Beach:</b> This beach often has displays of animals and birds skillfully made from sand, which you can also learn how to do. It's also the perfect place for lying in the sun — or why not explore the beach paths on foot for an hour or two? The views are fantastic.</p>`
  },
  p2_2: {
    title: "Part 2 • Đề 2: Film Studios (A–E)",
    text: `<p><b>A. Grand Studios:</b> Come and visit amazingly realistic sets, from the streets of New York to the historical sites of Rome — and walk around them. The tour also includes a bus ride to places in the surrounding area which have appeared in films, with a staff member to tell you whatever you'd like to know.</p>
    <p><b>B. West Ways:</b> To visit this studio, get tickets in advance through the website, to avoid long queues — it's very popular with people who love top movies from the 40s, many of which were filmed here. The studio also has a great selection of items from various movies, now on sale as souvenirs!</p>
    <p><b>C. Waverley Studios:</b> These studios are huge, with plenty of space for displaying the scenery and stages where big stars acted in scenes from famous films. Check the website to see exactly what the studio offers inside. And because you're not shown around in groups, you can spend as much time there as you want!</p>
    <p><b>D. Movie World:</b> Many famous movies from the last century were made in these studios, and you can still see the costumes worn in them, and the original sets used in the films. There's a useful digital guide you can buy here, so you'll find your way through these studios really quickly!</p>
    <p><b>E. Film Park:</b> Film Park has an amazing collection of old cars once used in films — and they still work! So, have a trip in one and see the studios as you're driven around its huge city street scenes. There's also a collection of original clothes that stars were dressed in for their movies. Visitors get free photos of themselves as they leave.</p>`
  },
  p2_3: {
    title: "Part 2 • Đề 3: Animated Films (A–E)",
    text: `<p><b>A. Terry:</b> The pop music in this film is great, as it features the voices of top performers. The film follows a friendly tiger in the jungle, who becomes a hero to his friends. This film first came out in the 70s, and the graphics in this beautiful film have changed very little.</p>
    <p><b>B. Constanz:</b> This beautiful film, with simple graphics, is based on the well-known novel, which has become very popular in school classrooms. Although it's full of comedy situations and surprises from beginning to end, the film also has a serious message, and will leave you with something to think about after you've watched it.</p>
    <p><b>C. Magic Makers:</b> This is a gentle film about a village of animals who all help each other through life — but things don't always go at all as they expected. In fact, they're usually far better! A beautiful, funny film with great songs you won't forget. You'll never get tired of watching it!</p>
    <p><b>D. Imagining:</b> While you're watching this beautiful film, you'll also be entertained by the wonderful piano and violin music that accompanies it. It's a film for the whole family, including young children, to sit down and see together. And everyone will find that they have something in common with the people in the film.</p>
    <p><b>E. Roundabout:</b> The pictures are so fantastic, they almost need nothing more than the piano music that accompanies them. The film focuses on some brave friends who come together to support each other in various ways, and the well-known performers saying their words bring something really special to it. The film has lots to teach teenagers.</p>`
  },
  p2_4: {
    title: "Part 2 • Đề 4: Geography Websites (A–E)",
    text: `<p><b>A. Geographical:</b> This website has lots of maps, quizzes and advice, to check your knowledge of what you've studied — and remind you of anything you've forgotten! There's a brilliant section about popular places in many different countries, which attract large numbers of visitors, with background historical details about the reasons these places are now so well known.</p>
    <p><b>B. Planet Zoom:</b> Not sure how to understand the information included on maps? Here's a step-by-step guide to using them! The site also has games and puzzles about all the continents, including Africa, Asia and Europe, and important details about them, such as their huge size, and their mountain ranges, rivers and climate.</p>
    <p><b>C. Geo watch:</b> What's underneath the ground we walk on? You'll find maps and diagrams here to tell you — including what you'd see inside the planet if you cut it in half! There's information, too, about parts of the world that aren't land, but actually oceans and seas, and help on researching and presenting project information.</p>
    <p><b>D. Worldwide:</b> This website has lots of beautiful photos, maps and film clips to help you learn more about some of the highest — and coldest — peaks on the planet. You'll find plenty of amazing facts about them, together with details of the wildlife that makes its home in the surrounding areas.</p>
    <p><b>E. Go world:</b> How do people live in places with very high or low temperatures in different seasons? Find out how people adapt to the climate they live in, how it affects their lives and what they do to stay warm or keep cool, as necessary. You can also upload your own stories about life in extreme temperatures in your country.</p>`
  },
  p2_5: {
    title: "Part 2 • Đề 5: Department Stores (A–E)",
    text: `<p><b>A. Stafford's:</b> This store is popular for its range of good quality sportswear at very reasonable prices, which is hard to find elsewhere. And on the ground floor, you'll find displays of their famous handmade candies — great for celebrations! And Stafford's is always the first to offer new designs in men's and women's clothing, too!</p>
    <p><b>B. Davidson's:</b> This traditional-looking store opened in 1860, and still offers high-class, fashionable goods at reasonable prices, with many made from natural materials. The men's clothes are particularly recommended, and there's also an area selling nothing but beautiful jewellery. And on fine days, try the rooftop restaurant — the food is fantastic.</p>
    <p><b>C. Barton's:</b> Barton's has been here since it opened in 1930, and still has its huge glass door and beautiful windows. The first floor is fantastic for children, as it's packed with things to play with — at reasonable prices. And downstairs, you'll find a huge selection of amazing fresh food rarely found elsewhere.</p>
    <p><b>D. Ford and Made croft's:</b> The café here serves fantastic meals, but also has amazing chocolates and frozen desserts of all kind, and the bakers produce fantastic biscuits and cakes to take away. Upstairs, you'll find a display of toys and also a huge range of board games, together with instructions to help you play.</p>
    <p><b>E. Hall wick's:</b> People often visit Hall wick's just for the displays of lights that make it so attractive to shop here. And it was the first to sell clothes made of pure, natural cotton, grown in conditions that avoid creating pollution. The assistants are polite and will help with any questions about goods.</p>`
  },

  // PART 3 PASSAGES
  p3_1: {
    title: "Part 3 • Đề 1: Amazing facts about teenager's brain",
    text: `<p>The problem isn't teenagers — it's their brains. Teenagers sleep a lot. They need about 9–10 hours' sleep a night, while adults need 6–8 hours. But they are not staying in bed because they are lazy. It's because levels of the 'sleep' hormone, melatonin, increase later at night and decrease later in the morning.</p>
    <p>Teenage boys have lots of little accidents. They are often clumsy because they are <b>growing so quickly</b> (sometimes 3 cm in 3 months). When the body grows quickly, the brain doesn't know how to control it yet.</p>
    <p>Teenagers do dangerous things because their brains are changing. In a teenager's brain, there are <b>few connections</b> between different parts of the brain, so teenagers <b>don't plan</b> before they do something. Also, the 'pleasure centre' is very large — that's why music sounds so great at 15.</p>
    <p>Teenagers have lots of emotions because the <b>limbic system</b> (which creates memories and emotions) grows when you're a teenager. Teenagers worry about friends' opinions because when <b>teenagers' brains grow</b>, they develop new skills to see themselves from others' viewpoints.</p>
    <p>When you become an adult, you need less sleep, your body stops growing, the pleasure centre becomes smaller, and life becomes easier — and maybe a little more boring!</p>`
  },
  p3_2: {
    title: "Part 3 • Đề 2: Computer games as tools for play",
    text: `<p>Most children enjoy playing computer games. However, parents often worry that if their children play computer games they will interact <b>less</b> with friends. Many people see this as a greater problem with <b>boys</b> than with girls, because boys enjoy fast-paced action games and adults notice violent elements in many of them.</p>
    <p>However, computer games are still games, like table tennis: very few people play simply to win — people play because it is a fun way to spend time together. Children sometimes play computer games on their own to pass the time when bored, but very few would rather play alone than spend time with friends.</p>
    <p>Typically, children play in a group of <b>different ages</b>. Young children can play very complicated games designed for older children because being part of the group is important, while games for their own age group are seen as 'childish'.</p>
    <p>Just like watching online videos, going to the cinema, or TV series, computer games are tools for social interaction and being together.</p>`
  },
  p3_3: {
    title: "Part 3 • Đề 3: Charlie Chaplin's early life",
    text: `<p>He was believed to have been born on April 16, 1889, though there is doubt whether he was born in 1889. His parents separated soon after his birth. His father died an alcoholic when Charlie was 12, and his mother died in 1928 in the United States, two years after coming to live with Chaplin — by then a commercial success.</p>
    <p>Charlie first took to the stage aged five (1894) in Music Hall (UK). In 1903, his first regular job was acting as the newspaper boy Billy in <i>Sherlock Holmes</i>. Later he joined Fred Karno's slapstick comedy company (British).</p>
    <p>According to immigration records, he arrived in the United States with the Karno troupe on <b>October 2, 1912</b>. He shared a room in a boarding house with Stan Laurel. Film producer Mack Sennett saw Chaplin's act in the US and hired him for the Keystone Film Company.</p>`
  },
  p3_4: {
    title: "Part 3 • Đề 4: Galina Amato & Bruno Silva",

    <p><b>Bruno Silva:</b> From São Paulo, Brazil. I'm studying education — this is my <b>last year</b>. I live with my parents and my little sister (14). I'm always interested in learning new ways to do things. I've been teaching primary-school students (7–10 years old) for 5 years. I teach English to children after school, and help secondary-school students with homework at the weekend.</p>`
  },
  p3_5: {
    title: "Part 3 • Đề 5: Emails (Lockwood & Jenny)",

  p3_6: {
    title: "Part 3 • Đề 6: Studying in the UK",
    text: `<p>Over 485,000 foreign students study in the UK, with the largest number (over 120,000) from <b>China</b>. The most popular courses are <b>business studies and engineering</b>. A British Council report suggests that by 2024 an <b>additional 83,000</b> international students will come to the UK.</p>
    <p><b>Li Jing (Hong Kong):</b> Always dreamed of coming to Britain; studying <b>medicine</b> at Edinburgh (a friendly city).</p>
    <p><b>Mushtaq (Pakistan):</b> Been to the UK many times; has family in <b>Manchester</b>. Studying <b>law</b>; at the end of the year needs to hand in three long essays.</p>
    <p><b>Andreas (Germany):</b> English is the only foreign language I speak. Culture and food are similar to Germany. Revising for final exams in <b>psychology</b>.</p>`

  p3_7: {
    title: "Part 3 • Đề 7: A day at Raskin Cattle Ranch",
    text: `<p>I spent last summer holiday in California and went on a day trip to a working cattle ranch north of LA. Traffic was bad and it took ages, but our guide Maria kept us entertained with stories and jokes.</p>
    <p>The Raskin Ranch has been a family business since <b>1895</b> (over 100 years). Workers wear jeans and cowboy hats because it's the most practical way to dress for their work — not as a tourist show.</p>
    <p>Lunch had one thing on the menu: barbecue steak — the best steak I've ever eaten! It was incredible how much we crammed into a short visit. I hadn't had much to do with horses, but they were calm for beginners. Later I learnt to throw a lasso and build a campfire ("they don't teach you that in school!"). I don't know if I'll ever go to California again, but if I do I'll definitely visit.</p>`
  },
  p3_8: {
    title: "Part 3 • Đề 8: The careful traveler",
    text: `<p>Steve Potter travels as cheaply as possible. According to Steve, it's hard to see the real culture of a city from a hotel. In Havana, he stayed with a Cuban family, saw a bagpipe performance, and talked with performers who showed him how to play — showing how cheap travel offers a closer look at life.</p>
    <p>In the Czech Republic with his parents (in their 60s), they stayed in a youth hostel where backpackers treated them just like everybody else. Steve says following a guidebook too closely makes you miss treats.</p>
    <p>On his first major trip, savings meant for 3 months lasted 3 years across 3 continents. How to spend so little is "no secret". He sometimes dines for free when invited by generous locals. For Steve, being imaginative and making the most of any situation matters more than just living cheaply.</p>`
  },
  p3_9: {
    title: "Part 3 • Đề 9: Ocean Research (Tessa)",
    text: `<p>Tessa's biology teacher was delighted when she joined a sea-life project she had seen on a <b>biology website</b>. Her flight cost less than a week's holiday in a diving resort. Coral had reduced by 90% (global warming); divers collected data for international scientists studying rising temperatures.</p>
    <p>Tessa lived in an <b>old camp</b>. The routine included housework — several people complained. Everyone had to pass a test identifying coral before diving without staff. They visited a nearby school where local children taught <i>them</i> about the island. On weekends they hired cars or took crowded local buses, with little time to relax on the beach. Food was very simple, yet for Tessa the whole experience was incredible.</p>`
  },
  p3_10: {
    title: "Part 3 • Đề 10: A young English sailor",
    text: `<p>Sally (17) sailed around Britain alone; one year later her 15-year-old cousin Mark did the same, so she's no longer the youngest. Her father has built and repaired boats all his life. Before Sally was old enough to go to school, the family took a 6-month Pacific cruise.</p>
    <p>Sally saved her own money to buy an old yacht, and got financial assistance from a sports company in return for advertising their product on the side of the boat. In Aberdeen she stayed with her dad's old friend (a former keen sailor). She emailed her schoolwork to her dad to check.</p>
    <p>Problems: a faulty fuel pump, 2-metre waves, and a complete lack of wind delayed her arrival in Aberdeen. Later, Sally did everything she could to encourage her cousin Mark to copy her.</p>`
  },

  p4_1: {
    title: "Part 4 • Test 1: Health: 1970s and TODAY",
    text: `<p><b>Food & drink:</b> In the 1970s people didn't worry much about food and ate more red meat & white bread. Today white bread sales dropped 75%, people prefer wholemeal bread and eat less red meat, though they still love chips!</p>
    <p><b>Healthcare:</b> Today people live longer thanks to drugs (statins) and MRI machines, giving doctors better understanding. One area that has become worse is <b>food allergies</b> (lack of Vitamin D).</p>
    <p><b>Exercise:</b> In the 1970s there weren't many fitness centres; today over 10 million British people go to gyms regularly, yet daily lives are less active because more people drive cars instead of walking.</p>
    <p><b>Technology:</b> Improved healthcare & offers online workouts/health apps, but also negative effects: sitting long periods causes neck, shoulders & back problems, and blue light causes lack of sleep and stress.</p>`

  p4_2: {
    title: "Part 4 • Test 2: Living to change (Kieran)",
    text: `<p>About two years ago, I earned a good salary but spent it immediately on restaurants and new clothes. I worried a lot about money, so I decided to make a change.</p>
    <p>First, I stopped buying new clothes and wore things already in my wardrobe. After that, I got a roommate (Tim). Then I started cooking at home — at first I was a terrible cook, but watching online videos made my food delicious and healthier, so I lost weight! When my clothes didn't fit, I bought used clothes online and sold my old ones. In the end, I spent my savings on a cookery course to study to be a chef.</p>`

  p4_4: {

  p4_5: {
    title: "Part 4 • Test 5: We get great pleasure from reading",
    text: `<p>The more advanced a man is, the greater delight he finds in reading. Ordinary people may think philosophers and scientists don't read for pleasure, but this is not true — mathematics is mental recreation just like an adventure story.</p>
    <p>First in order of popularity is novel-reading, letting us escape into a new world very much like <b>our world</b> and yet different from <b>it</b>. Next in order of popularity are travel books, biographies and memoirs, which are true and give us knowledge and <b>immense</b> (great) pleasure.</p>`

  p4_6: {
    title: "Part 4 • Test 6: Successful students",
    text: `<p>Successful students get an overview before reading, find key info, relate points, use <b>prior</b> (earlier) knowledge, monitor understanding, and use a variety of study skills flexibly.</p>
    <p>Conversely, low-achieving students take a passive role and rely on others (teachers, parents) to monitor their studying. They use a restricted range of study skills. <b>They</b> (low-achieving students) cannot explain why good study strategies are important.</p>`

  p4_7: {
    title: "Part 4 • Test 7: Apollo 11 & Moon Samples",
    text: `<p>Apollo 11 astronauts brought back rock and soil samples for scientists to study. Moon soil contains small bits of rock and spherical glass (about half); scientists found no trace of animal or plant life.</p>
    <p>Astronauts gathered two types of rocks: <b>Basalt</b> (volcanic lava formed at high temperatures) and <b>Breccia</b> (formed by impact; "<b>It</b> consists of small pieces of rock compressed together"). Gases (hydrogen, helium) were carried by solar wind <b>emitted</b> (sent out) by the Sun.</p>`
  },
  p4_8: {
    title: "Part 4 • Test 8: Marianne Moore",
    text: `<p>Marianne Moore (1887–1972) wrote compressed poems on varied subjects: animals, laborers (workers), artists, and the craft of poetry. She quoted others extensively ("a cabinet of fossils" is her metaphor for her writing).</p>
    <p>She grew up in Kirkwood, taught in Carlisle, worked as a librarian in NYC, edited <i>The Dial</i>, and lived quietly mostly in <b>Brooklyn, New York</b>. Her poetry has been read by <b>succeeding</b> (future) generations. She won the Pulitzer Prize in 1952. "To earn a living is needful, but <b>it</b> [earning a living] can be done in routine ways."</p>`
  },
  p4_9: {
    title: "Part 4 • Test 9: We Bought a Zoo",
    text: `<p>In 2005, after Benjamin Mee's father died, his mother lived alone in London. Benjamin wanted to sell her house and buy a zoo so the whole family could live together and take care of each other. His wife was <b>anxious</b> (worried) because she was very ill.</p>
    <p>After a year of trying to buy the zoo, in October 2006 "they did <b>it</b>" (buying the zoo). A jaguar escaped, repairs cost £500,000, and his wife died. In July 2007 the zoo opened. He wrote <i>We Bought a Zoo</i> (2008), and a 2012 Hollywood film earned money that helped pay bills and keep the zoo open.</p>`
  },
  p4_10: {
    title: "Part 4 • Test 10: Fathers these days",
    text: `<p>In the past, fathers earned money and did not dress or feed children. Today's fathers want to be closer, playing with kids and preparing meals (more hands-on).</p>

// ============================================================================
// 2. APPLICATION STATE & STORAGE
// ============================================================================
const STORAGE_KEY = 'b1_reading_pink_v2';

const defaultState = {
  mastered: {},
  wrong: {},
  todayDate: new Date().toISOString().slice(0, 10),
  todayCount: 0,
  dailyGoal: 25,
  lastSession: null,
  settings: {
    darkMode: false,
    fontSize: 'md',
    autoNext: true,
    studyPeek: false,
    shuffle: false,
    badgeClearance: true
  }
};

let state = loadState();
let currentTab = 'home';
let homeMode = 'single'; // 'single' | 'mix'
let openParts = { 1: true }; // Part 1 expanded by default
let mixSelectedParts = { 1: true, 2: false, 3: true, 4: false, 5: true };
let mixCountLimit = 0; // 0 = all, 20, 50
let wrongFilterPart = 0; // 0 = all, 1..5

let session = null; // { mode, title, questions, idx, answers, revealed, timerSec, timerId, meta }
let swipeDir = 'anim-view';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const parsed = JSON.parse(raw);
    const merged = {
      ...defaultState,
      ...parsed,
      settings: { ...defaultState.settings, ...(parsed.settings || {}) }
    };
    const today = new Date().toISOString().slice(0, 10);
    if (merged.todayDate !== today) {
      merged.todayDate = today;
      merged.todayCount = 0;
    }
    return merged;
  } catch (e) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

// ============================================================================
// 3. THEME, FONT & BADGE CLEARANCE HELPERS
// ============================================================================
function applyThemeAndFont() {
  const html = document.documentElement;
  const app = document.getElementById('app');
  const moon = document.getElementById('icon-moon');
  const sun = document.getElementById('icon-sun');

  if (state.settings.darkMode) {
    html.classList.add('dark');
    moon.classList.add('hidden');
    sun.classList.remove('hidden');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1A0F16');
  } else {
    html.classList.remove('dark');
    moon.classList.remove('hidden');
    sun.classList.add('hidden');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFF5F8');
  }

  if (state.settings.badgeClearance) {
    html.classList.remove('no-badge-clearance');
  } else {
    html.classList.add('no-badge-clearance');
  }

  app.classList.remove('fs-sm', 'fs-md', 'fs-lg');
  app.classList.add(`fs-${state.settings.fontSize || 'md'}`);
}

function toggleTheme() {
  state.settings.darkMode = !state.settings.darkMode;
  saveState();
  applyThemeAndFont();
}

function cycleFontSize() {
  const order = ['sm', 'md', 'lg'];
  const cur = order.indexOf(state.settings.fontSize || 'md');
  state.settings.fontSize = order[(cur + 1) % order.length];
  saveState();
  applyThemeAndFont();
  const labels = { sm: 'Nhỏ', md: 'Vừa', lg: 'Lớn' };
  showToast(`Cỡ chữ: ${labels[state.settings.fontSize]}`);
}

function toggleSetting(key) {
  state.settings[key] = !state.settings[key];
  saveState();
  applyThemeAndFont();
  if (session) {
    swipeDir = '';
    renderMain();
  } else {
    renderMain();
  }
}

function updateWrongBadge() {
  const count = Object.keys(state.wrong).length;
  const badge = document.getElementById('badge-wrong');
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// ============================================================================
// 4. NAVIGATION & HEADER CONTROL
// ============================================================================
function setHeader(title, sub, inSession, quickLabel = '') {
  const btnBack = document.getElementById('btn-back');
  const titleWrap = document.getElementById('header-title-wrap');
  const quickBtn = document.getElementById('btn-quick-switch');
  const tabBar = document.getElementById('tab-bar');
  const timerEl = document.getElementById('exam-timer');

  document.getElementById('header-title').textContent = title;
  document.getElementById('header-sub').textContent = sub;

  if (inSession) {
    btnBack.classList.remove('hidden');
    tabBar.classList.add('hidden');
    if (session && session.mode === 'exam') {
      titleWrap.classList.remove('hidden');
      quickBtn.classList.add('hidden');
      timerEl.classList.remove('hidden');
    } else {
      titleWrap.classList.add('hidden');
      quickBtn.classList.remove('hidden');
      document.getElementById('quick-switch-label').textContent = quickLabel || title;
      timerEl.classList.add('hidden');
    }
  } else {
    btnBack.classList.add('hidden');
    titleWrap.classList.remove('hidden');
    quickBtn.classList.add('hidden');
    timerEl.classList.add('hidden');
    tabBar.classList.remove('hidden');
  }
}

function switchTab(tab) {
  if (session) {
    exitQuizSession(true);
  }
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const isActive = btn.dataset.tab === tab;
    if (isActive) {
      btn.classList.remove('text-sakuraMuted/70', 'dark:text-berryMuted/70');
      btn.classList.add('text-sakuraPrimary', 'dark:text-sakuraLight');
    } else {
      btn.classList.add('text-sakuraMuted/70', 'dark:text-berryMuted/70');
      btn.classList.remove('text-sakuraPrimary', 'dark:text-sakuraLight');
    }
  });
  renderMain();
}

function exitQuizSession(silent = false) {
  if (session && session.mode === 'exam' && !session.submitted && !silent) {
    showConfirm('Thoát bài thi thử?', 'Kết quả bài thi đang làm sẽ không được lưu.', () => {
      stopExamTimer();
      session = null;
      switchTab(currentTab);
    });
    return;
  }
  stopExamTimer();
  session = null;
  switchTab(currentTab);
}

// ============================================================================
// 5. MAIN ROUTER
// ============================================================================
function renderMain() {
  const main = document.getElementById('main-content');
  if (session) {
    renderQuizView(main);
    return;
  }
  if (currentTab === 'home') {
    setHeader('Đọc B1 • Học Thuộc 🌸', `${Object.keys(state.mastered).length}/${QUESTIONS.length} câu đã thuộc`, false);
    renderHomeTab(main);
  } else if (currentTab === 'wrong') {
    const wc = Object.keys(state.wrong).length;
    setHeader('Ngân Hàng Câu Sai 💗', wc ? `${wc} câu cần phục thù` : 'Sạch bóng câu sai!', false);
    renderWrongTab(main);
  } else if (currentTab === 'exam') {
    setHeader('Thi Thử Chuẩn B1 ✨', '35 câu • 45 phút • Thang 30đ', false);
    renderExamTab(main);
  } else if (currentTab === 'settings') {
    setHeader('Cài Đặt & Tiến Độ ⚙️', 'Tuỳ chỉnh trải nghiệm học thuộc', false);
    renderSettingsTab(main);
  }
}

  container.innerHTML = `

      </div>
    </div>
  `;
}

// ============================================================================
// 10. STARTING STUDY & EXAM SESSIONS
// ============================================================================
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function launchStudySession(qs, label, meta) {
  if (!qs || qs.length === 0) {
    showToast('Không có câu hỏi phù hợp');
    return;
  }
  const finalQs = state.settings.shuffle ? shuffleArray(qs) : [...qs];
  state.lastSession = { label, meta };
  saveState();

  session = {
    mode: 'study',
    title: label,
    questions: finalQs,
    idx: 0,
    answers: {},
    revealed: {},
    submitted: false
  };
  swipeDir = 'anim-view';
  renderMain();
}

function startPartSession(partNum) {
  const qs = QUESTIONS.filter(q => q.part === partNum);
  launchStudySession(qs, `Part ${partNum} • Toàn bộ`, { type: 'part', part: partNum });
}

function startTestSession(partNum, testNum) {
  const qs = QUESTIONS.filter(q => q.part === partNum && q.test === testNum);
  launchStudySession(qs, `Part ${partNum} • Đề ${testNum}`, { type: 'test', part: partNum, test: testNum });
}

function startMixSession() {
  const selected = [1, 2, 3, 4, 5].filter(p => mixSelectedParts[p]);
  if (selected.length === 0) return;
  let qs = QUESTIONS.filter(q => mixSelectedParts[q.part]);
  if (mixCountLimit > 0) {
    qs = shuffleArray(qs).slice(0, mixCountLimit);
  } else if (state.settings.shuffle) {
    qs = shuffleArray(qs);
  }
  const label = `Gộp P${selected.join('+')} (${qs.length} câu)`;
  state.lastSession = { label, meta: { type: 'mix', parts: selected, limit: mixCountLimit } };
  saveState();

  session = {
    mode: 'study',
    title: label,
    questions: qs,
    idx: 0,
    answers: {},
    revealed: {},
    submitted: false
  };
  swipeDir = 'anim-view';
  renderMain();
}

function startWrongSession() {
  const allWrongQs = QUESTIONS.filter(q => state.wrong[q.id]);
  const qs = wrongFilterPart === 0 ? allWrongQs : allWrongQs.filter(q => q.part === wrongFilterPart);
  launchStudySession(qs, `Ôn Câu Sai (${qs.length} câu)`, { type: 'wrong' });
}

function resumeLastSession() {
  if (!state.lastSession || !state.lastSession.meta) return;
  const m = state.lastSession.meta;
  if (m.type === 'part') startPartSession(m.part);
  else if (m.type === 'test') startTestSession(m.part, m.test);
  else if (m.type === 'mix') {
    mixSelectedParts = { 1: false, 2: false, 3: false, 4: false, 5: false };
    (m.parts || [1]).forEach(p => mixSelectedParts[p] = true);
    mixCountLimit = m.limit || 0;
    startMixSession();
  } else {
    startWrongSession();
  }
}

function startExamSession() {
  const pickTest = (p, maxT) => Math.floor(Math.random() * maxT) + 1;
  const p1 = QUESTIONS.filter(q => q.part === 1 && q.test === pickTest(1, 6));
  const p2 = QUESTIONS.filter(q => q.part === 2 && q.test === pickTest(2, 5));
  const p3 = QUESTIONS.filter(q => q.part === 3 && q.test === pickTest(3, 10));
  const p4 = QUESTIONS.filter(q => q.part === 4 && q.test === pickTest(4, 10));
  const p5 = QUESTIONS.filter(q => q.part === 5 && q.test === pickTest(5, 10));
  const examQs = [...p1, ...p2, ...p3, ...p4, ...p5];

  session = {
    mode: 'exam',
    title: 'Thi Thử B1',
    questions: examQs,
    idx: 0,
    answers: {},
    revealed: {},
    submitted: false,
    timerSec: 45 * 60,
    timerId: null
  };

  session.timerId = setInterval(() => {
    if (!session || session.mode !== 'exam' || session.submitted) return;
    session.timerSec--;
    updateTimerDisplay();
    if (session.timerSec <= 0) {
      submitExam(true);
    }
  }, 1000);

  swipeDir = 'anim-view';
  renderMain();
  updateTimerDisplay();
}

function stopExamTimer() {
  if (session && session.timerId) {
    clearInterval(session.timerId);
    session.timerId = null;
  }
}

function updateTimerDisplay() {
  const el = document.getElementById('exam-timer');
  if (!session || session.mode !== 'exam') return;
  const m = Math.floor(Math.max(0, session.timerSec) / 60);
  const s = Math.max(0, session.timerSec) % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

    let cardCls = 'bg-sakuraCard dark:bg-berryCard border-sakuraBorder/90 dark:border-berryBorder text-sakuraText dark:text-berryText';
    let badgeCls = 'bg-sakuraSoft dark:bg-berrySoft text-sakuraPrimary dark:text-sakuraLight';

    if (isExam) {
      if (userAns === idx) {
        cardCls = 'pink-gradient-soft border-sakuraPrimary dark:border-sakuraLight text-sakuraText dark:text-berryText ring-2 ring-sakuraPrimary/25';
        badgeCls = 'pink-gradient text-white';
      }
    } else {
      if (isAnswered) {
        if (idx === q.ans) {
          cardCls = 'bg-mintBg dark:bg-emerald-950/45 border-mintBorder dark:border-emerald-600 text-mintText dark:text-emerald-200 font-bold';
          badgeCls = 'bg-mintText text-white';
        } else if (idx === userAns && userAns !== q.ans) {
          cardCls = 'bg-coralBg dark:bg-red-950/45 border-coralBorder dark:border-red-700 text-coralText dark:text-red-200';
          badgeCls = 'bg-coralText text-white';
        }
      } else if (isPeek && idx === q.ans) {
        cardCls = 'bg-mintBg/75 dark:bg-emerald-950/35 border-mintBorder dark:border-emerald-700 text-mintText dark:text-emerald-200 font-bold';
        badgeCls = 'bg-mintText text-white';
      }
    }

    const optLabel = q.part === 3 ? (idx === 0 ? 'T' : 'F') : letters[idx];

    return `
      <button id="opt-btn-${idx}" onclick="selectOption(${idx})" class="q-opt w-full min-h-[54px] p-3.5 rounded-[16px] border text-left transition active:scale-[0.985] flex items-center gap-3 shadow-xs ${cardCls}">
        <span class="w-8 h-8 rounded-[11px] flex items-center justify-center font-black text-[13.5px] shrink-0 ${badgeCls}">${optLabel}</span>
        <span class="leading-snug flex-1">${escapeHtml(optText)}</span>
      </button>
    `;
  }).join('');

  const tipHtml = showTip ? `
    <div class="anim-view mt-3 p-3.5 rounded-[16px] pink-gradient-soft border border-sakuraBorder dark:border-berryBorder text-sakuraText dark:text-berryText text-[13px] leading-snug shadow-xs">
      <span class="font-extrabold text-sakuraPrimary dark:text-sakuraLight">💡 Mẹo học thuộc: </span>${escapeHtml(q.tip)}
    </div>
  ` : '';

  const passageBtnHtml = q.passageKey ? `
    <button onclick="openPassageSheet('${q.passageKey}', ${q.part === 5 ? q.num : 0})" class="px-3 py-1.5 rounded-full pink-gradient text-white text-[12px] font-extrabold shadow-xs active:scale-95 transition flex items-center gap-1 shrink-0">
      <span>📄 Xem bài đọc</span>
    </button>
  ` : '';

  const rightActionBtn = isExam && session.idx === total - 1
    ? `<button onclick="confirmSubmitExam()" class="flex-1 py-3.5 rounded-[16px] pink-gradient text-white font-extrabold text-[14.5px] shadow-roseGlow active:scale-95 transition">Nộp bài thi ✓</button>`
    : `<button onclick="nextQuestion()" class="flex-1 py-3.5 rounded-[16px] pink-gradient text-white font-extrabold text-[14.5px] shadow-roseGlow active:scale-95 transition">Câu tiếp →</button>`;

  container.innerHTML = `
    <div id="quiz-swipe-area" class="h-full flex flex-col justify-between">
      <!-- Top Control Strip -->
      <div class="px-4 pt-2.5 pb-2 space-y-2 shrink-0">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5">
            <span class="text-[12.5px] font-black text-sakuraPrimary dark:text-sakuraLight tabular-nums">Câu ${session.idx + 1}/${total}</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-sakuraSoft dark:bg-berrySoft text-sakuraMuted dark:text-berryMuted">P${q.part} • Đề ${q.test}</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="cycleFontSize()" class="px-2.5 py-1 rounded-full bg-sakuraCard dark:bg-berryCard border border-sakuraBorder dark:border-berryBorder text-[11.5px] font-extrabold text-sakuraMuted dark:text-berryMuted active:scale-90">A±</button>
            <button onclick="openQMap()" class="px-2.5 py-1 rounded-full bg-sakuraCard dark:bg-berryCard border border-sakuraBorder dark:border-berryBorder text-[12px] font-extrabold text-sakuraPrimary dark:text-sakuraLight active:scale-90">☰ ${Object.keys(session.answers).length}/${total}</button>
          </div>
        </div>

        <!-- Thin Progress Line -->
        <div class="w-full h-1.5 rounded-full bg-sakuraSoft dark:bg-berrySoft overflow-hidden">
          <div class="h-full pink-gradient rounded-full transition-all duration-300" style="width:${progressPct}%"></div>
        </div>

        <!-- Mode Pills -->
        <div class="flex items-center justify-between gap-1.5">
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            ${!isExam ? `
              <button onclick="toggleSetting('studyPeek')" class="px-2.5 py-1 rounded-full border text-[11.5px] font-extrabold transition active:scale-95 ${state.settings.studyPeek ? pillActive : pillIdle}">👀 Học thuộc</button>
              <button onclick="toggleSetting('autoNext')" class="px-2.5 py-1 rounded-full border text-[11.5px] font-extrabold transition active:scale-95 ${state.settings.autoNext ? pillActive : pillIdle}">⚡ Tự qua</button>
            ` : `<span class="text-[11.5px] font-bold text-sakuraMuted dark:text-berryMuted">Vuốt trái/phải đổi câu</span>`}
          </div>
          ${passageBtnHtml}
        </div>
      </div>

      <!-- Scrollable Question & Options -->
      <div class="flex-1 overflow-y-auto no-scrollbar px-4 pb-3 ${swipeDir}">
        <div class="bg-sakuraCard dark:bg-berryCard rounded-[22px] p-4 shadow-rose border border-sakuraBorder/80 dark:border-berryBorder mb-3">
          ${q.tag ? `<div class="text-[11px] font-extrabold uppercase tracking-wider text-sakuraPrimary dark:text-sakuraLight mb-1.5">${escapeHtml(q.tag)}</div>` : ''}
          ${q.testTitle ? `<div class="text-[11px] font-extrabold uppercase tracking-wider text-sakuraPrimary dark:text-sakuraLight mb-1.5">${escapeHtml(q.testTitle)}</div>` : ''}
          <p class="q-prompt font-bold text-sakuraText dark:text-berryText">${escapeHtml(q.prompt)}</p>
        </div>

        <div class="space-y-2.5">
          ${optionsHtml}
        </div>

        ${tipHtml}
      </div>

      <!-- Bottom Thumb Navigation Bar -->
      <div class="safe-bottom px-4 pt-2.5 bg-white/90 dark:bg-berryCard/90 backdrop-blur-xl border-t border-sakuraBorder/80 dark:border-berryBorder flex items-center gap-2.5 shrink-0">
        <button onclick="prevQuestion()" ${session.idx === 0 ? 'disabled' : ''} class="px-4 py-3.5 rounded-[16px] bg-sakuraSoft dark:bg-berrySoft text-sakuraPrimary dark:text-sakuraLight font-extrabold text-[14px] active:scale-95 transition disabled:opacity-35">
          ← Trước
        </button>
        ${rightActionBtn}
      </div>
    </div>
  `;

  attachSwipeHandlers();
}

function selectOption(optIdx) {
  if (!session) return;
  const q = session.questions[session.idx];
  const isExam = session.mode === 'exam';

  session.answers[q.id] = optIdx;

  if (isExam) {
    swipeDir = '';
    renderQuizView(document.getElementById('main-content'));
    return;
  }

  const isCorrect = optIdx === q.ans;
  if (isCorrect) {
    if (!state.mastered[q.id]) {
      state.mastered[q.id] = true;
      state.todayCount++;
    }
    if (state.wrong[q.id]) {
      delete state.wrong[q.id];
    }
  } else {
    state.wrong[q.id] = true;
  }
  saveState();
  updateWrongBadge();

  swipeDir = '';
  renderQuizView(document.getElementById('main-content'));

  const chosenBtn = document.getElementById(`opt-btn-${optIdx}`);
  if (chosenBtn) {
    chosenBtn.classList.add(isCorrect ? 'anim-correct' : 'anim-wrong');
  }

  if (isCorrect && state.settings.autoNext && session.idx < session.questions.length - 1) {
    const curIdx = session.idx;
    setTimeout(() => {
      if (session && session.idx === curIdx) {
        nextQuestion();
      }
    }, 680);
  }
}

function nextQuestion() {
  if (!session) return;
  if (session.idx < session.questions.length - 1) {
    session.idx++;
    swipeDir = 'anim-next';
    renderQuizView(document.getElementById('main-content'));
  } else if (session.mode === 'study') {
    showToast('🎉 Đã hoàn thành lượt học!');
  }
}

function prevQuestion() {
  if (!session || session.idx === 0) return;
  session.idx--;
  swipeDir = 'anim-prev';
  renderQuizView(document.getElementById('main-content'));
}

function goToQuestion(index) {
  if (!session) return;
  swipeDir = index > session.idx ? 'anim-next' : 'anim-prev';
  session.idx = index;
  closeQMap();
  renderQuizView(document.getElementById('main-content'));
}

function confirmSubmitExam() {
  const answered = Object.keys(session.answers).length;
  const total = session.questions.length;
  showConfirm('Nộp bài thi thử?', `Bạn đã làm ${answered}/${total} câu. Chấm điểm ngay?`, () => {
    submitExam(false);
  });
}

function submitExam(autoTimeout) {
  stopExamTimer();
  session.submitted = true;
  if (autoTimeout) showToast('⏰ Đã hết giờ làm bài!');
  renderQuizView(document.getElementById('main-content'));
}

function renderExamResult(container) {
  setHeader('Kết Quả Thi Thử B1 🏆', 'Thang điểm chuẩn 30 điểm', true, 'Kết quả thi');
  let rawScore = 0;
  let correctCount = 0;

  session.questions.forEach(q => {
    const ua = session.answers[q.id];
    const ok = ua === q.ans;
    if (ok) {
      correctCount++;
      rawScore += (q.part === 5 ? 1.25 : 0.5);
    } else if (ua !== undefined) {
      state.wrong[q.id] = true;
    }
  });
  saveState();
  updateWrongBadge();

  const finalScore = Number(rawScore.toFixed(2));
  const passed = finalScore >= 20;

  const reviewHtml = session.questions.map((q, i) => {
    const ua = session.answers[q.id];
    const ok = ua === q.ans;
    return `
      <div class="p-3.5 rounded-[16px] border ${ok ? 'bg-mintBg/60 dark:bg-emerald-950/30 border-mintBorder dark:border-emerald-800' : 'bg-coralBg/60 dark:bg-red-950/30 border-coralBorder dark:border-red-800'}">
        <div class="flex items-center justify-between text-[11.5px] font-extrabold mb-1">
          <span>Câu ${i + 1} (Part ${q.part})</span>
          <span class="${ok ? 'text-mintText dark:text-emerald-400' : 'text-coralText dark:text-red-400'}">${ok ? '✓ Đúng' : '✕ Sai'}</span>
        </div>
        <p class="text-[13px] font-semibold mb-1.5">${escapeHtml(q.prompt)}</p>
        <div class="text-[12px] font-bold text-mintText dark:text-emerald-300">Đáp án: ${escapeHtml(q.options[q.ans])}</div>
        ${!ok && ua !== undefined ? `<div class="text-[11.5px] text-coralText dark:text-red-300 mt-0.5">Bạn chọn: ${escapeHtml(q.options[ua])}</div>` : ''}
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="anim-view p-4 space-y-4 pb-10">
      <div class="pink-gradient rounded-[24px] p-5 text-white text-center shadow-roseMd">
        <div class="text-[12px] font-extrabold uppercase tracking-wider opacity-90">${passed ? '🎉 CHÚC MỪNG ĐẠT B1' : '💪 CỐ GẮNG THÊM NHÉ'}</div>
        <div class="text-[40px] font-black leading-none my-2">${finalScore} <span class="text-[18px] font-bold opacity-85">/ 30đ</span></div>
        <div class="text-[13px] font-bold opacity-95">Đúng ${correctCount}/${session.questions.length} câu</div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="startExamSession()" class="py-3 rounded-[15px] pink-gradient text-white font-extrabold text-[13.5px] shadow-roseGlow active:scale-95 transition">Thi lại đề mới</button>
        <button onclick="switchTab('home')" class="py-3 rounded-[15px] bg-sakuraCard dark:bg-berryCard border border-sakuraBorder dark:border-berryBorder font-extrabold text-[13.5px] active:scale-95 transition">Về trang chủ</button>
      </div>

      <h3 class="font-extrabold text-[14.5px] pt-1">Chi tiết bài làm:</h3>
      <div class="space-y-2.5">
        ${reviewHtml}
      </div>
    </div>
  `;
}

// ============================================================================
// 12. BOTTOM SHEETS (PASSAGE, Q-MAP, QUICK PART/TEST SWITCHER)
// ============================================================================
function openPassageSheet(key, highlightBlankNum = 0) {
  const p = PASSAGES[key];
  if (!p) return;
  document.getElementById('passage-title').textContent = p.title;
  let html = p.text;
  if (highlightBlankNum > 0) {
    const token = `<b>(${highlightBlankNum})`;
    html = html.replace(token, `<b class="px-1.5 py-0.5 rounded-md pink-gradient text-white">(${highlightBlankNum})`);
  }
  document.getElementById('passage-body').innerHTML = html;
  document.getElementById('passage-backdrop').classList.add('open');
  document.getElementById('passage-sheet').classList.add('open');
}

function closePassageSheet() {
  document.getElementById('passage-backdrop').classList.remove('open');
  document.getElementById('passage-sheet').classList.remove('open');
}

function openQMap() {
  if (!session) return;
  const total = session.questions.length;
  document.getElementById('qmap-sub').textContent = `Đã chọn ${Object.keys(session.answers).length}/${total} câu`;
  const grid = document.getElementById('qmap-grid');
  grid.innerHTML = session.questions.map((q, i) => {
    const isCur = i === session.idx;
    const ua = session.answers[q.id];
    let cls = 'bg-sakuraBg dark:bg-berryBg border-sakuraBorder dark:border-berryBorder text-sakuraText dark:text-berryText';
    if (ua !== undefined) {
      if (session.mode === 'exam') {
        cls = 'pink-gradient-soft border-sakuraPrimary text-sakuraPrimary dark:text-sakuraLight font-black';
      } else if (ua === q.ans) {
        cls = 'bg-mintBg dark:bg-emerald-950/50 border-mintBorder text-mintText dark:text-emerald-300 font-black';
      } else {
        cls = 'bg-coralBg dark:bg-red-950/50 border-coralBorder text-coralText dark:text-red-300 font-black';
      }
    }
    if (isCur) cls += ' ring-2 ring-sakuraPrimary';
    return `<button onclick="goToQuestion(${i})" class="h-11 rounded-[13px] border text-[13.5px] font-bold flex items-center justify-center active:scale-90 transition ${cls}">${i + 1}</button>`;
  }).join('');

  document.getElementById('qmap-backdrop').classList.add('open');
  document.getElementById('qmap-sheet').classList.add('open');
}

function closeQMap() {
  document.getElementById('qmap-backdrop').classList.remove('open');
  document.getElementById('qmap-sheet').classList.remove('open');
}

function openQuickSwitcher() {
  const body = document.getElementById('switcher-body');
  body.innerHTML = PART_META.map(pm => {
    let testBtns = '';
    for (let t = 1; t <= pm.tests; t++) {
      testBtns += `<button onclick="closeQuickSwitcher(); startTestSession(${pm.part}, ${t})" class="px-2.5 py-1.5 rounded-[10px] bg-sakuraBg dark:bg-berryBg border border-sakuraBorder dark:border-berryBorder text-[12px] font-bold active:scale-95">Đề ${t}</button>`;
    }
    return `
      <div class="p-3.5 rounded-[18px] bg-sakuraBg/60 dark:bg-berryBg/60 border border-sakuraBorder/80 dark:border-berryBorder space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <span class="font-extrabold text-[13.5px]">${pm.icon} ${pm.name}</span>
          <button onclick="closeQuickSwitcher(); startPartSession(${pm.part})" class="px-2.5 py-1 rounded-full pink-gradient text-white text-[11.5px] font-extrabold active:scale-95 shrink-0">Học cả Part</button>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${testBtns}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('switcher-backdrop').classList.add('open');
  document.getElementById('switcher-sheet').classList.add('open');
}

function closeQuickSwitcher() {
  document.getElementById('switcher-backdrop').classList.remove('open');
  document.getElementById('switcher-sheet').classList.remove('open');
}

// ============================================================================
// 13. TOUCH SWIPE GESTURES & UTILITIES
// ============================================================================
function attachSwipeHandlers() {
  const el = document.getElementById('quiz-swipe-area');
  if (!el) return;
  let startX = 0;
  let startY = 0;

  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  el.addEventListener('touchend', e => {
    if (!startX || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = 0;
    startY = 0;
    if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      if (dx < 0) nextQuestion();
      else prevQuestion();
    }
  }, { passive: true });
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-2');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.add('opacity-0', 'translate-y-2');
  }, 1900);
}

function showConfirm(title, msg, onOk) {
  const backdrop = document.getElementById('modal-backdrop');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  backdrop.classList.remove('hidden');

  const btnCancel = document.getElementById('modal-cancel');
  const btnOk = document.getElementById('modal-ok');

  const cleanup = () => backdrop.classList.add('hidden');
  btnCancel.onclick = cleanup;
  btnOk.onclick = () => {
    cleanup();
    onOk();
  };
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ============================================================================
// 14. INITIALIZE APP
// ============================================================================
applyThemeAndFont();
updateWrongBadge();
renderMain();
</script>
